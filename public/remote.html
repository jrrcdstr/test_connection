<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanta Tayo remote</title>
  <meta name="theme-color" content="#1535a8">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="/fonts/baloo2.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <style>
    main { max-width: 34rem; margin: 0 auto; padding: 14px 16px 0; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 18px; }
    header a { font: 800 22px/1 var(--display); color: var(--white); text-decoration: none; display: flex; align-items: center; gap: 10px; }
    header a img { display: block; border-radius: 9px; }
    header { align-items: center !important; }
    .roomtag { font: 800 18px/1 var(--display); letter-spacing: 0.14em; color: var(--sky); }
    section { padding: 22px 0; border-top: 2px solid var(--deep); }
    section:first-of-type { border-top: 0; padding-top: 0; }
    h2 { font: 800 22px/1.1 var(--display); margin-bottom: 10px; }

    .phonevid { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; overflow: hidden; margin-bottom: 14px; box-shadow: 0 0 0 3px var(--deep); }
    .phonevid iframe, .phonevid > div { position: absolute; inset: 0; width: 100%; height: 100%; }

    .now { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center; }
    .now img { width: 112px; height: 63px; object-fit: cover; border-radius: 6px; background: var(--deep); display: block; }
    .now .who { font-size: 30px; max-width: 100%; }
    .now .song { color: var(--sky); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
    .nowctl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .nowctl .span { grid-column: 1 / -1; }

    .add { display: grid; gap: 12px; }
    .field { position: relative; }
    .field input { padding-right: 84px; }
    .field .paste { position: absolute; right: 5px; top: 5px; min-height: 38px; padding: 6px 12px; font-size: 14px; }
    .hint { color: var(--sky); font-size: 14px; }

    .joinbox { padding-top: 12vh; }
    .joinbox form { display: grid; gap: 12px; max-width: 20rem; }

    details summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
    details p { color: var(--sky); margin: 8px 0 14px; }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="/" aria-label="Kanta Tayo home"><img src="/icon-192.png" alt="" width="40" height="40">Kanta Tayo</a>
      <span class="roomtag hidden" id="roomTag"></span>
    </header>

    <div class="joinbox hidden" id="joinBox">
      <form id="joinForm">
        <label for="codeInput">Enter the code shown on the TV</label>
        <input class="codefield" id="codeInput" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
        <button type="submit">Join the party</button>
      </form>
    </div>

    <div id="app" class="hidden">
      <section aria-label="Now singing">
        <div class="phonevid hidden" id="phoneVid"><div id="ytPhone"></div></div>
        <div class="now">
          <img id="nowImg" alt="" width="112" height="63">
          <div>
            <div class="lyric sung who" id="nowWho" data-text=""></div>
            <div class="song" id="nowSong">No one is singing yet</div>
          </div>
        </div>
        <div class="nowctl">
          <button class="btn-plain" id="pauseBtn" disabled>Pause</button>
          <button class="btn-plain" id="skipBtn" disabled>Skip</button>
          <button class="btn-plain span" id="watchBtn" aria-pressed="false">Show the video here, muted</button>
        </div>
      </section>

      <section>
        <h2>Pick your song</h2>
        <form class="add" id="addForm">
          <div>
            <label for="singer">Your name</label>
            <input id="singer" maxlength="30" autocomplete="given-name" required>
          </div>
          <div>
            <label for="url">YouTube link, or a song to look for</label>
            <div class="field">
              <input id="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="My Way karaoke" required>
              <button type="button" class="btn-plain paste" id="pasteBtn">Paste</button>
            </div>
          </div>
          <button type="submit" id="addBtn">Find on YouTube</button>
          <p class="hint" id="addHint">Type a song to find it on YouTube. There, tap Share, then Copy link, and paste the link here.</p>
        </form>
      </section>

      <section>
        <h2>Up next <span class="quiet" id="count"></span></h2>
        <ul class="queue" id="queue"></ul>
      </section>

      <section>
        <details>
          <summary>TV lost its internet?</summary>
          <p>Play the songs on this phone instead. The current song and the queue continue here, and the TV stops.</p>
          <button class="btn-plain btn-wide" id="takeoverBtn">Play on this phone</button>
        </details>
      </section>
    </div>
  </main>
  <script type="module" src="/remote.js"></script>
</body>
</html>
