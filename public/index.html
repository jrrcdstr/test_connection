<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanta Tayo videoke</title>
  <meta name="description" content="Free videoke for your party. Play songs on the TV and pick them from your phone.">
  <meta name="theme-color" content="#1535a8">
  <link rel="preload" href="/fonts/baloo2.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <style>
    main { max-width: 34rem; margin: 0 auto; padding: clamp(32px, 9vh, 96px) 20px 0; }
    h1 { font-size: clamp(56px, 17vw, 112px); }
    .lead { font-size: 19px; margin: 20px 0 36px; max-width: 26rem; }
    .join { margin-top: 40px; padding-top: 28px; border-top: 2px solid var(--deep); }
    .join form { display: flex; gap: 10px; max-width: 22rem; }
    .join .codefield { flex: 1; min-width: 0; }
    ol { margin: 40px 0 0; padding: 28px 0 0 1.3em; border-top: 2px solid var(--deep); color: var(--sky); }
    ol li { padding-left: 4px; margin-bottom: 6px; }
    ol li::marker { font: 800 18px var(--display); color: var(--white); }
  </style>
</head>
<body>
  <main>
    <h1 class="lyric sing" data-text="Kanta tayo!">Kanta tayo!</h1>
    <p class="lead">Videoke for your party. Songs play on the TV, and everyone picks theirs from a phone.</p>

    <a class="btn btn-wide" href="/host.html">Use this screen as the TV</a>

    <section class="join">
      <label for="code">On your phone? Enter the code shown on the TV</label>
      <form id="join">
        <input class="codefield" id="code" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
        <button type="submit" class="btn-plain">Join</button>
      </form>
    </section>

    <ol>
      <li>Open this site on the TV or a laptop and start the party.</li>
      <li>Scan the code on the TV with your phone.</li>
      <li>Copy a karaoke video's link from YouTube and paste it in.</li>
    </ol>
  </main>
  <script>
    document.getElementById("join").addEventListener("submit", (e) => {
      e.preventDefault();
      const code = document.getElementById("code").value.trim().toUpperCase();
      if (code) location.href = `/remote.html?room=${encodeURIComponent(code)}`;
    });
  </script>
</body>
</html>
