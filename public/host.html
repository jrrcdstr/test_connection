<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanta Tayo! TV Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { overflow-x: hidden; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; min-height: 100vh; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .now { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
    .now .label { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
    .now .who { font-size: clamp(20px, 3vw, 32px); font-weight: 800; color: var(--yellow); line-height: 1.1; }
    .now .song { color: var(--text); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .screen { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
    .screen iframe, #player { position: absolute; inset: 0; width: 100%; height: 100%; }
    .splash, .score { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; gap: 10px; }
    .splash { background: radial-gradient(circle at center, #3a1a6b, #0c0616); }
    .splash .big { font-size: clamp(28px, 5vw, 56px); font-weight: 800; }
    .splash .code { font-size: clamp(48px, 10vw, 120px); font-weight: 800; letter-spacing: .15em; color: var(--yellow); }
    .score { background: #0c0616ee; z-index: 5; }
    .score .num { font-size: clamp(90px, 20vw, 240px); font-weight: 800; line-height: 1; background: linear-gradient(180deg, var(--yellow), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .score .msg { font-size: clamp(22px, 4vw, 44px); font-weight: 800; }
    .score .sub { color: var(--muted); }
    .hidden { display: none !important; }
    aside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .join { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
    .join .qr { background: #fff; padding: 8px; border-radius: 10px; width: 136px; height: 136px; }
    .join .qr svg { width: 120px; height: 120px; display: block; }
    .join .code { font-size: 40px; font-weight: 800; letter-spacing: .12em; color: var(--yellow); line-height: 1; }
    .join .url { word-break: break-all; }
    h3 { margin: 0 0 10px; font-size: 16px; }
    .addform { display: grid; gap: 8px; }
    .start { position: fixed; inset: 0; background: #0c0616f2; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .start .card { max-width: 460px; text-align: center; }
    .start label { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 14px 0 18px; }
    .start input[type=checkbox] { width: 20px; height: 20px; }
    .confetti { position: absolute; top: -10px; width: 10px; height: 14px; animation: fall linear forwards; z-index: 6; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  </style>
</head>
<body>
  <div class="start" id="start">
    <div class="card">
      <h2 class="brand" style="font-size:34px;margin:0 0 8px">Kanta Tayo! 🎤</h2>
      <p class="muted">This screen plays the songs. Put it on the TV, then tap start so the browser allows sound.</p>
      <label><input type="checkbox" id="useMic"> Use microphone for scoring (optional)</label>
      <button class="btn-yellow" id="startBtn" style="width:100%">▶ Start the party</button>
      <p class="muted small" id="startMsg" style="margin-top:12px"></p>
    </div>
  </div>

  <div class="layout">
    <section class="stage">
      <div class="now">
        <div style="min-width:0">
          <div class="label">Now singing</div>
          <div class="who" id="nowWho">Waiting for songs…</div>
          <div class="song" id="nowSong"></div>
        </div>
        <div class="controls">
          <button class="btn-ghost btn-small" id="skipBtn" title="Skip this song">⏭ Skip</button>
          <button class="btn-ghost btn-small" id="fsBtn" title="Fullscreen">⛶ Fullscreen</button>
        </div>
      </div>
      <div class="screen" id="screen">
        <div id="player"></div>
        <div class="splash" id="splash">
          <div class="big">Add a song from your phone!</div>
          <div class="muted">Scan the QR code or go to the site and enter</div>
          <div class="code" id="splashCode">····</div>
        </div>
        <div class="score hidden" id="score">
          <div class="sub" id="scoreWho"></div>
          <div class="num" id="scoreNum">0</div>
          <div class="msg" id="scoreMsg"></div>
          <button class="btn-small" id="nextBtn" style="margin-top:8px">Next song ▶</button>
        </div>
      </div>
    </section>

    <aside>
      <div class="card join">
        <div class="qr" id="qr" aria-label="QR code to join"></div>
        <div style="min-width:0">
          <div class="muted small">Room code</div>
          <div class="code" id="code">····</div>
          <div class="muted small url" id="joinUrl"></div>
        </div>
      </div>

      <div class="card">
        <h3>🎶 Up next <span class="muted small" id="count"></span></h3>
        <ul class="queue" id="queue"></ul>
      </div>

      <div class="card">
        <h3>➕ Add a song here</h3>
        <form class="addform" id="addForm">
          <input id="singer" placeholder="Singer name" maxlength="30" autocomplete="off">
          <input id="url" placeholder="Paste YouTube link" autocomplete="off" required>
          <button type="submit">Add to queue</button>
        </form>
      </div>
    </aside>
  </div>

  <script type="module" src="/host.js"></script>
</body>
</html>
